name: CI

# v1.2 layer groups run here. The v1.2.1 conformance suite is kept in
# .github/workflows/v121-gates.yml; its required outcome is controlled by
# tests/run_groups.py for the checked-out revision.
#
# Group definitions are shared with local runs via tests/run_groups.py, so CI and
# a developer machine never diverge.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  LVA_ROOT: ${{ github.workspace }}

jobs:
  test-groups:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        group: [contract, invariants, unit, fault, integration, migration, ux, harness]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.6"

      - name: Install dependencies
        shell: pwsh
        run: uv sync --locked --extra dev --extra audio-test --python 3.11

      - name: Set up Node for contract group
        if: matrix.group == 'contract'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Rust for contract group
        if: matrix.group == 'contract'
        uses: dtolnay/rust-toolchain@stable

      - name: Install TypeScript generator for contract group
        if: matrix.group == 'contract'
        shell: pwsh
        working-directory: apps/desktop-ui
        run: npm ci

      - name: Build Rust generator for contract group
        if: matrix.group == 'contract'
        shell: pwsh
        run: cargo build --release --manifest-path tools/codegen-rust/Cargo.toml

      - name: Show group registry
        shell: pwsh
        run: .\.venv\Scripts\python.exe -B tests/run_groups.py --list

      - name: Run group '${{ matrix.group }}'
        shell: pwsh
        run: .\.venv\Scripts\python.exe -B tests/run_groups.py ${{ matrix.group }}

  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.6"
      - name: Install locked lint group
        shell: pwsh
        run: uv sync --locked --group lint --python 3.11
      - name: Lint Python Core and group runner
        shell: pwsh
        run: .\.venv\Scripts\ruff.exe check src/lva tests/run_groups.py

  schema-zero-diff:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.6"
      - name: Install dependencies
        shell: pwsh
        run: uv sync --locked --extra dev --python 3.11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install the TypeScript generator
        shell: pwsh
        working-directory: apps/desktop-ui
        run: npm ci

      - name: Build the Rust generator
        shell: pwsh
        run: cargo build --release --manifest-path tools/codegen-rust/Cargo.toml

      - name: Regenerate contracts and require zero diff
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -B -m lva.contracts.codegen
          .\.venv\Scripts\python.exe -B -m lva.contracts.codegen --verify
          git add -A -- schemas apps/desktop-ui/src/generated apps/desktop-shell/src-tauri/src/generated
          git diff --cached --exit-code
