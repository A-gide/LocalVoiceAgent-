<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>LocalVoiceAgent Pet</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-drag: none;
    }
    body {
      margin: 0;
      padding: 0;
      background: transparent !important;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .loading-card {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 16px;
      padding: 24px 28px;
      color: #f1f5f9;
      text-align: center;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5), 0 0 20px rgba(56, 189, 248, 0.2);
      max-width: 300px;
      animation: fadeIn 0.3s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .spinner {
      width: 44px;
      height: 44px;
      margin: 0 auto 16px auto;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top: 3px solid #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .title {
      font-size: 15px;
      font-weight: 600;
      color: #f8fafc;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    .subtitle {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #38bdf8;
      margin-right: 6px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .retry-btn {
      display: none;
      margin-top: 14px;
      padding: 6px 14px;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .retry-btn:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>
  <div class="loading-card">
    <div class="spinner" id="spinner"></div>
    <div class="title" id="title">
      <span class="status-dot" id="dot"></span>正在唤醒桌面伴侣
    </div>
    <div class="subtitle" id="subtitle">正在连接 Live2D 引擎...<br><span style="font-size:11px; opacity:0.8;">(127.0.0.1:12393)</span></div>
    <button class="retry-btn" id="retryBtn" onclick="startProbing()">立即重试</button>
  </div>

  <script>
    const TARGET_URL = "http://127.0.0.1:12393/?mode=pet";
    let attempts = 0;
    const MAX_ATTEMPTS = 60;
    let timer = null;

    async function checkServer() {
      attempts++;
      try {
        const response = await fetch(TARGET_URL, { method: "HEAD", mode: "no-cors" });
        document.getElementById("subtitle").innerText = "引擎已就绪，正在呈现形象...";
        setTimeout(() => {
          window.location.replace(TARGET_URL);
        }, 200);
        return;
      } catch (err) {
        // Port not yet listening
      }

      if (attempts >= MAX_ATTEMPTS) {
        document.getElementById("spinner").style.display = "none";
        document.getElementById("dot").style.background = "#ef4444";
        document.getElementById("title").innerText = "连接服务超时";
        document.getElementById("subtitle").innerHTML = "未能连接到 Live2D 后端 (127.0.0.1:12393)。<br>请检查服务是否已启动或右键托盘重试。";
        document.getElementById("retryBtn").style.display = "inline-block";
        return;
      }

      timer = setTimeout(checkServer, 500);
    }

    function startProbing() {
      attempts = 0;
      document.getElementById("spinner").style.display = "block";
      document.getElementById("dot").style.background = "#38bdf8";
      document.getElementById("title").innerHTML = '<span class="status-dot" id="dot"></span>正在唤醒桌面伴侣';
      document.getElementById("subtitle").innerHTML = '正在连接 Live2D 引擎...<br><span style="font-size:11px; opacity:0.8;">(127.0.0.1:12393)</span>';
      document.getElementById("retryBtn").style.display = "none";
      if (timer) clearTimeout(timer);
      checkServer();
    }

    startProbing();
  </script>
</body>
</html>
